<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Use My Current Account — Activity Log</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      margin: 0;
      color: #222;
      background: #fff;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 16px;
      margin: 0;
    }

    .note {
      color: #666;
      margin: 4px 0 16px;
    }

    #clear {
      flex: none;
      padding: 5px 12px;
      border: none;
      border-radius: 4px;
      background: #0078d4;
      color: #fff;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    #clear:hover {
      background: #106ebe;
    }

    .entry {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid #e8e8e8;
    }

    .time {
      flex: none;
      width: 150px;
      color: #666;
      font-variant-numeric: tabular-nums;
    }

    .action {
      flex: 1;
      min-width: 0;
    }

    .site {
      display: block;
      color: #666;
      overflow-wrap: anywhere;
    }

    .flow {
      flex: none;
      font-size: 11px;
      color: #0078d4;
      border: 1px solid currentColor;
      border-radius: 8px;
      padding: 0 7px;
    }

    #empty {
      color: #666;
      padding: 24px 0;
      text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #eee;
        background: #2b2b2b;
      }

      .note,
      .time,
      .site,
      #empty {
        color: #aaa;
      }

      .entry {
        border-bottom-color: #4a4a4a;
      }

      .flow {
        color: #6cb8f0;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Activity log</h1>
      <button type="button" id="clear">Clear log</button>
    </header>
    <p class="note">Sign-in requests processed by the extension, newest first. Entries never include
    email addresses or URLs, stay on this device, and only the 200 most recent are kept.</p>
    <div id="entries"></div>
    <div id="empty" hidden>No sign-in events recorded yet.</div>
  </main>
  <script src="log.js"></script>
</body>
</html>
