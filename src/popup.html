<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Use My Current Account</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      margin: 0;
      min-width: 260px;
      color: #222;
      background: #fff;
    }

    main {
      padding: 12px 14px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #status {
      font-weight: 600;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex: none;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #999;
      border-radius: 10px;
      transition: background 0.15s;
      cursor: pointer;
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 2px;
      top: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.15s;
    }

    .switch input:checked + .slider {
      background: #0078d4;
    }

    .switch input:focus-visible + .slider {
      outline: 2px solid #0078d4;
      outline-offset: 2px;
    }

    .switch input:checked + .slider::before {
      transform: translateX(16px);
    }

    .account {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #e0e0e0;
    }

    .caption {
      color: #666;
      margin-bottom: 6px;
    }

    .account-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      cursor: pointer;
    }

    .account-label {
      flex: 1;
      overflow-wrap: anywhere;
    }

    .remove {
      flex: none;
      border: none;
      background: none;
      color: #a00;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .remove:hover {
      background: rgba(170, 0, 0, 0.1);
    }

    #add-form {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    #new-account {
      flex: 1;
      min-width: 0;
      padding: 5px 8px;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: inherit;
      color: inherit;
      font: inherit;
      font-size: 12px;
    }

    #add-form button {
      flex: none;
      padding: 5px 12px;
      border: none;
      border-radius: 4px;
      background: #0078d4;
      color: #fff;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    #add-form button:hover {
      background: #106ebe;
    }

    .error {
      margin-top: 6px;
      color: #a00;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #eee;
        background: #2b2b2b;
      }

      .account {
        border-top-color: #4a4a4a;
      }

      .caption {
        color: #aaa;
      }

      .remove,
      .error {
        color: #f88;
      }

      #new-account {
        border-color: #666;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="row">
      <span id="status">Enabled</span>
      <label class="switch">
        <input type="checkbox" id="toggle">
        <span class="slider"></span>
      </label>
    </div>
    <div class="account">
      <div class="caption">Sign in with</div>
      <div id="accounts"></div>
      <form id="add-form">
        <input type="email" id="new-account" placeholder="other@account.com" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <div id="error" class="error" hidden></div>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
